# =============================================================================
# داخل server { ... } مربوط به api.webinoo-plus.ir قرار دهید
# (بعد از include شدن rate-limit.conf در http {})
# =============================================================================

limit_conn webinoo_conn 40;

# --- SMS / OTP ---
location ~* ^/api/(auth/register/send-phone-code|confirmation-code/create|reset-password/send-code|oil/register/send-code|customer-register/send-code|[^/]+/customer-register/send-code|repair/auth/send-code)$ {
    limit_req zone=webinoo_sms burst=3 nodelay;
    limit_req_status 429;
    try_files $uri $uri/ /index.php?$query_string;
}

# --- لاگین / verify ---
location ~* ^/api/(auth/login|auth/register|oil/login|oil/register|customer/login|customer-register/(login|verify|check-phone)|[^/]+/customer/(login)|[^/]+/customer-register/(login|verify|check-phone)|confirmation-code/check|reset-password(/confirm)?|repair/(auth|tech-auth)/(verify|register))$ {
    limit_req zone=webinoo_login burst=5 nodelay;
    limit_req_status 429;
    try_files $uri $uri/ /index.php?$query_string;
}

# --- سفارش میز / رسید / سرویس / پیجر / guest lookup ---
location ~* ^/api/[^/]+/(table-order|table-orders|table-service-request|table-pager|guest/lookup) {
    limit_req zone=webinoo_storefront_write burst=8 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    try_files $uri $uri/ /index.php?$query_string;
}

# --- گزارش و لیست سنگین ---
location ~* ^/api/(reports|product-all|category-all|manufacturers/report/sales|financial-report/) {
    limit_req zone=webinoo_heavy burst=10 nodelay;
    limit_req_status 429;
    try_files $uri $uri/ /index.php?$query_string;
}

# --- بقیه API ---
location /api/ {
    limit_req zone=webinoo_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 12m;
    try_files $uri $uri/ /index.php?$query_string;
}
