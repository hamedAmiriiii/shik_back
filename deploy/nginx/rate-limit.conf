# =============================================================================
# Rate limit لبه برای API وبینو — include در http {} یا conf.d
# مثال: include /etc/nginx/snippets/webinoo-rate-limit.conf;
# =============================================================================

# عمومی API: ۱۲۰ req/min هر IP (burst کوتاه)
limit_req_zone $binary_remote_addr zone=webinoo_api:20m rate=120r/m;

# لاگین / verify: ۱۰ req/min
limit_req_zone $binary_remote_addr zone=webinoo_login:10m rate=10r/m;

# ارسال OTP/SMS: ۵ req/min
limit_req_zone $binary_remote_addr zone=webinoo_sms:10m rate=5r/m;

# سفارش میز / آپلود / مهمان: ۲۰ req/min
limit_req_zone $binary_remote_addr zone=webinoo_storefront_write:10m rate=20r/m;

# گزارش و لیست سنگین (حتی با توکن): ۳۰ req/min
limit_req_zone $binary_remote_addr zone=webinoo_heavy:10m rate=30r/m;

# اتصال همزمان زیاد از یک IP
limit_conn_zone $binary_remote_addr zone=webinoo_conn:10m;
